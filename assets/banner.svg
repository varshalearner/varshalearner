<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Varsha Sharma — SDET, API, Performance and Resiliency Testing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1f"/>
      <stop offset="0.55" stop-color="#140f2e"/>
      <stop offset="1" stop-color="#1c1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Inter', -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  </g>

  <!-- Left: identity -->
  <g class="sans">
    <text x="64" y="92" fill="#a5b4fc" font-size="16" font-weight="600" letter-spacing="3">SDET  •  QA AUTOMATION ENGINEER</text>
    <text x="62" y="158" fill="url(#accent)" font-size="60" font-weight="800" letter-spacing="-1">Varsha Sharma</text>
    <text x="64" y="200" fill="#c9d1d9" font-size="22">API · Performance · Resiliency test automation</text>
    <text x="64" y="230" fill="#8b949e" font-size="18">for cloud microservices on Kubernetes</text>
    <rect x="64" y="256" width="440" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="86" cy="273" r="5" fill="#3fb950"/>
    <text x="100" y="279" fill="#e2e8f0" font-size="15" font-weight="600">Open to SDET roles · Immediate joiner · NCR / Remote</text>
  </g>

  <!-- Right: terminal card -->
  <g transform="translate(700 52)">
    <rect width="440" height="220" rx="12" fill="#0b0b1e" fill-opacity="0.9" stroke="#2e2a55"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="20" r="6" fill="#27c93f"/>
    <text x="220" y="25" class="mono" fill="#6e7681" font-size="12" text-anchor="middle">ci · nightly regression</text>
    <line x1="0" y1="40" x2="440" y2="40" stroke="#221f42"/>
    <g class="mono" font-size="15">
      <text x="22" y="72" fill="#8b949e">$ <tspan fill="#c9d1d9">run-suite regression --parallel</tspan></text>
      <text x="22" y="102" fill="#3fb950">✓ <tspan fill="#c9d1d9">functional</tspan><tspan x="160" fill="#8b949e">~3,000 tests</tspan></text>
      <text x="22" y="126" fill="#3fb950">✓ <tspan fill="#c9d1d9">security</tspan><tspan x="160" fill="#8b949e">OIDC·SAML·JWT·mTLS</tspan></text>
      <text x="22" y="150" fill="#3fb950">✓ <tspan fill="#c9d1d9">longevity</tspan><tspan x="160" fill="#8b949e">72h run · k6</tspan></text>
      <text x="22" y="174" fill="#3fb950">✓ <tspan fill="#c9d1d9">chaos</tspan><tspan x="160" fill="#8b949e">pod-kill survived</tspan></text>
      <text x="22" y="204" fill="#818cf8">runtime <tspan fill="#f85149" text-decoration="line-through" dx="8">5h</tspan><tspan fill="#c9d1d9" dx="8">→</tspan><tspan fill="#3fb950" font-weight="700" dx="8">3h</tspan><tspan class="cursor" fill="#c9d1d9" dx="6">▍</tspan></text>
    </g>
  </g>
</svg>
